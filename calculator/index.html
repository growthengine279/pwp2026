\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ r.col3 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex:1 0 250px;padding:24px 0 8px 28px;border-left:1px solid #E5E2DC;\">\n                  <div style=\"font-size:11px;font-weight:600;letter-spacing:0.18em;color:#B08A2E;margin-bottom:16px;\">PROPERTY 2<\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #E5E2DC;font-size:14.5px;\"><span style=\"color:#55555A;\">Purchase price<\u002Fspan><strong>{{ r.priceF }}<\u002Fstrong><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #E5E2DC;font-size:14.5px;\"><span style=\"color:#55555A;\">Deposit and costs, from your equity<\u002Fspan><strong>{{ r.depositF }}<\u002Fstrong><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #E5E2DC;font-size:14.5px;\"><span style=\"color:#55555A;\">Borrowed against the property<\u002Fspan><strong>{{ r.loanF }}<\u002Fstrong><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #E5E2DC;font-size:14.5px;\"><span style=\"color:#55555A;\">Rent a week<\u002Fspan><strong>{{ r.rentWkF }}<\u002Fstrong><\u002Fdiv>\n                  <div style=\"display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-top:1px solid #E5E2DC;font-size:14.5px;\"><span style=\"color:#55555A;\">Costs you, after rent and tax, a week<\u002Fspan><strong>{{ r.weeklyBF }}<\u002Fstrong><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"max-width:760px;margin-bottom:64px;border-top:1px solid #0A0A0A;border-bottom:1px solid #E5E2DC;\">\n            <button sc-camel-on-click=\"{{ onAsmToggle }}\" style=\"width:100%;background:none;border:none;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:22px 0;cursor:pointer;font-size:17px;font-weight:600;color:#0A0A0A;text-align:left;\">\n              <span>The assumptions behind these numbers<\u002Fspan>\n              <span style=\"color:#B08A2E;font-weight:400;font-size:26px;line-height:1;\">{{ asmLabel }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ asmOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"padding:8px 0 32px;\">\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:26px 32px;\">\n                  <sc-for list=\"{{ asmFields }}\" as=\"f\" hint-placeholder-count=\"9\">\n                    <div>\n                      <label style=\"display:block;font-size:10.5px;font-weight:600;letter-spacing:0.14em;color:#55555A;margin-bottom:4px;\">{{ f.label }}<\u002Flabel>\n                      <input data-key=\"{{ f.key }}\" sc-camel-input-mode=\"decimal\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ onAsmChange }}\" style=\"width:100%;box-sizing:border-box;font-size:18px;font-weight:600;padding:7px 0;border:none;border-bottom:1px solid #0A0A0A;background:transparent;outline:none;\" style-focus=\"border-bottom:1px solid #B08A2E;\">\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <p style=\"font-size:14px;color:#55555A;margin:24px 0 0;\">Change any of these and the numbers above update. Nothing here is hidden from you, which is the point.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div>\n            <a href=\"/\" style=\"display:inline-flex;align-items:center;gap:10px;background:#B08A2E;color:#0A0A0A;text-decoration:none;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:0.08em;padding:18px 34px;\" style-hover=\"background:#9A7724;color:#0A0A0A;\">SHOW ME HOW TO CLOSE THE GAP <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n            <div style=\"font-size:14px;color:#55555A;margin-top:14px;\">45 minutes, free, and you keep the plan whether you buy anything or not.<\u002Fdiv>\n          <\u002Fdiv>\n\n          <p style=\"font-style:italic;font-size:13.5px;color:#55555A;line-height:1.6;max-width:68ch;margin:44px 0 0;\">Estimate only. Assumes a {{ r.priceF }} property at {{ av.yield }}% rental yield, {{ av.growth }}% growth a year, {{ av.rate }}% loan interest, lending capped at {{ av.lvr }}% of your home's value and {{ av.dti }} times household income, rental expenses and depreciation as shown, and {{ av.sell }}% selling costs with capital gains tax at half your marginal rate. It assumes nothing goes wrong. Property values can fall and rents can drop. This is general information only, it does not take your personal circumstances into account, and it is not financial advice.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showEquityScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:620px;margin:0 auto;\">\n          <h2 style=\"font-size:clamp(64px,12vw,120px);font-weight:700;letter-spacing:-0.04em;line-height:0.95;margin:0 0 36px;\">Not yet<span style=\"color:#B08A2E;\">.<\u002Fspan><\u002Fh2>\n          <p style=\"max-width:60ch;margin:0 0 14px;\">Your usable equity today is <strong>{{ r.equityF }}<\u002Fstrong>. The deposit and costs on one investment property come to about <strong>{{ r.depositNeededF }}<\u002Fstrong>, so you are <strong>{{ r.shortfallF }}<\u002Fstrong> short.<\u002Fp>\n          <p style=\"max-width:60ch;color:#55555A;margin:0 0 36px;\">Most people in that position are closer than they think. Another year or two of repayments, or some movement in your home's value, and the door opens.<\u002Fp>\n          <a href=\"/\" style=\"display:inline-flex;align-items:center;gap:10px;background:#B08A2E;color:#0A0A0A;text-decoration:none;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:0.08em;padding:18px 32px;\" style-hover=\"background:#9A7724;color:#0A0A0A;\">SEE WHAT WOULD NEED TO CHANGE <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showIncomeScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:620px;margin:0 auto;\">\n          <h2 style=\"font-size:clamp(64px,12vw,120px);font-weight:700;letter-spacing:-0.04em;line-height:0.95;margin:0 0 36px;\">Not yet<span style=\"color:#B08A2E;\">.<\u002Fspan><\u002Fh2>\n          <p style=\"max-width:60ch;margin:0 0 14px;\">You have the equity. On an income of <strong>{{ r.incomeF }}<\u002Fstrong> a bank is unlikely to lend enough on top of what you already owe.<\u002Fp>\n          <p style=\"max-width:60ch;color:#55555A;margin:0 0 14px;\">Equity gets you the deposit. Income gets you the loan. Both have to work, and right now the second one does not.<\u002Fp>\n          <p style=\"max-width:60ch;color:#55555A;margin:0 0 36px;\">That changes with a pay rise, a cleared car loan, or a smaller first property.<\u002Fp>\n          <a href=\"/\" style=\"display:inline-flex;align-items:center;gap:10px;background:#B08A2E;color:#0A0A0A;text-decoration:none;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:0.08em;padding:18px 32px;\" style-hover=\"background:#9A7724;color:#0A0A0A;\">SEE WHAT WOULD NEED TO CHANGE <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ showClearsScreen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"max-width:620px;margin:0 auto;\">\n          <h2 style=\"font-size:clamp(30px,5vw,48px);font-weight:700;letter-spacing:-0.025em;line-height:1.08;margin:0 0 28px;\">Good news, and it is not the news <em style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:#B08A2E;\">we expected<\u002Fem>.<\u002Fh2>\n          <p style=\"max-width:60ch;margin:0 0 14px;\">On these numbers, selling an investment property does not clear your home loan any faster than your current repayments already will.<\u002Fp>\n          <p style=\"max-width:60ch;color:#55555A;margin:0 0 14px;\">That usually means your mortgage is close to done, which is a good problem to have.<\u002Fp>\n          <p style=\"max-width:60ch;color:#55555A;margin:0 0 36px;\">The question that is actually worth answering from here is not how to pay the house off. It is what to do with the equity once it is paid off.<\u002Fp>\n          <a href=\"/\" style=\"display:inline-flex;align-items:center;gap:10px;background:#B08A2E;color:#0A0A0A;text-decoration:none;border-radius:999px;font-size:14px;font-weight:700;letter-spacing:0.08em;padding:18px 32px;\" style-hover=\"background:#9A7724;color:#0A0A0A;\">SEE WHAT THAT COULD LOOK LIKE <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg><\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <footer style=\"background:#0A0A0A;color:#8F8C85;padding:56px 24px 64px;\">\n    <div style=\"max-width:1120px;margin:0 auto;\">\n      <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:22px;\">\n        <span style=\"font-size:14px;font-weight:700;letter-spacing:0.16em;color:#FFFFFF;\">PERPETUAL WEALTH PARTNERS<\u002Fspan>\n        <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#B08A2E\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M8 7h9v9\"><\u002Fpath><\u002Fsvg>\n      <\u002Fdiv>\n      <p style=\"max-width:68ch;font-size:13px;line-height:1.7;margin:0 0 14px;\">This calculator gives general information only. It is an estimate based on the assumptions shown on screen. It does not take your personal circumstances into account and it is not financial advice.<\u002Fp>\n      <a href=\"#\" style=\"color:#8F8C85;font-size:13px;\" style-hover=\"color:#FFFFFF;\">Privacy Policy<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    step: 0, answers: ['', '', '', '', ''],\n    gate: { name: '', email: '', mobile: '' },\n    err: '', soft: false, view: 'form', done: false, asmOpen: false,\n    A: { price: 650000, yield: 4.5, rate: 6, growth: 6.8, lvr: 105, rentExpense: 25, dti: 6, sell: 3, tax: 34.5, deprecBldg: 2.5, buildPortion: 65, fittingsPool: 44000, fittingsRate: 25, loanCosts: 5500, loanCostYears: 5 }\n  };\n\n  Q = [\n    { t: 'How old are you?', h: 'We use this for one thing: telling you how old you will be when the mortgage ends.', m: false },\n    { t: 'What is your home worth today?', h: 'Your best guess is fine. Nobody is checking.', m: true },\n    { t: 'How much is still owing on it?', h: 'The balance on your last statement.', m: true },\n    { t: 'What do you repay each month?', h: 'Principal and interest, the whole monthly payment. Round it if you need to.', m: true },\n    { t: 'What is your household income before tax?', h: 'Equity gets you the deposit. Income is what decides how much a bank will lend you. Both have to work.', m: true }\n  ];\n\n  fmt(x) { return '$' + Math.round(x).toLocaleString('en-AU'); }\n  num(raw) { const s = String(raw).replace(/[,$\\s]/g, ''); if (s === '') return NaN; if (!/^-?\\d*\\.?\\d+$/.test(s)) return null; return parseFloat(s); }\n\n  validate(i, raw) {\n    const v = this.num(raw);\n    if (isNaN(v)) return { err: 'Pop a number in here so we can do the maths.' };\n    if (v === null) return { err: 'Numbers only, no words.' };\n    if (i === 0) { if (v < 18 || v > 80) return { err: 'Enter an age between 18 and 80.' }; return {}; }\n    if (v < 0) return { err: 'That needs to be zero or more.' };\n    if (v > 99999999 || (i === 3 && v > 999999)) return { err: 'That looks like one digit too many.' };\n    if (i === 1 && v < 50000) return { err: 'That looks like it is missing a digit. Have a quick check.', soft: true };\n    if (i === 3 && v < 200) return { err: 'That looks low for a monthly repayment. Is it a weekly figure?', soft: true };\n    if (i === 4 && v < 20000) return { err: 'That looks like it is missing a digit. Have a quick check.', soft: true };\n    if (i === 2) { const hv = this.num(this.state.answers[1]); if (hv > 0 && v > hv) return { err: 'That is fine, we can still run it. Hit next.', soft: true }; }\n    return {};\n  }\n\n  next = () => {\n    const s = this.state;\n    const chk = this.validate(s.step, s.answers[s.step]);\n    if (chk.err && !(chk.soft && s.soft)) { this.setState({ err: chk.err, soft: !!chk.soft }); return; }\n    this.setState({ step: s.step + 1, err: '', soft: false });\n  };\n  back = () => this.setState({ step: Math.max(0, this.state.step - 1), err: '', soft: false });\n\n  gateSubmit = () => {\n    const g = this.state.gate;\n    if (!g.name.trim()) { this.setState({ err: 'Pop your full name in here so we know who to send it to.' }); return; }\n    if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(g.email.trim())) { this.setState({ err: 'We need a real email or we cannot send your plan.' }); return; }\n    const mob = g.mobile.replace(/[\\s-]/g, '');\n    if (!/^04\\d{8}$/.test(mob)) { this.setState({ err: 'Australian mobiles start with 04 and have 10 digits.' }); return; }\n    const inp = this.inputs();\n    const payload = { firstName: g.name.trim(), email: g.email.trim(), mobile: mob, inputs: inp, assumptions: this.asm(), submittedAt: new Date().toISOString() };\n    console.log('PWP webhook payload:', JSON.stringify(payload, null, 2)); var _r = this.compute(); var _p = g.name.trim().split(' ').filter(function(x){ return x.length; }); var _fn = _p.shift() || ''; var _ln = _p.join(' '); window.PWP_SEND(window.PWP_CFG.calc, Object.assign({}, window.PWP_UTM(), { firstName: _fn, lastName: _ln, email: g.email.trim(), phone: '+61' + mob.slice(1), mobile: mob, source: 'pwp-calculator-optin', calc_age: inp.age, calc_home_value: inp.home, calc_owing: inp.owing, calc_repayment: inp.repay, calc_income: inp.income, calc_age_current_path: _r.ageA, calc_age_with_property: _r.ageB, calc_year_current_path: _r.yearA, calc_year_with_property: _r.yearB, calc_properties: _r.count, calc_outcome: _r.branch, pageUrl: window.location.href, submittedAt: payload.submittedAt }));\n    this.setState({ err: '', view: 'loading' });\n    setTimeout(() => { this.setState({ view: 'result', done: true }); this.persist(); }, 900);\n  };\n\n  persist() {\n    const r = this.compute();\n    try {\n      localStorage.setItem('pwp_lead', JSON.stringify({\n        firstName: this.state.gate.name.trim(), email: this.state.gate.email.trim(),\n        mobile: this.state.gate.mobile.replace(/[\\s-]/g, ''),\n        gap: r.branch === 'full' ? r.gap : null, branch: r.branch,\n        ageA: r.branch === 'full' ? r.ageA : null, ageB: r.branch === 'full' ? r.ageB : null,\n        yearA: r.branch === 'full' ? r.yearA : null, yearB: r.branch === 'full' ? r.yearB : null\n      }));\n    } catch (e) {}\n  }\n\n  inputs() {\n    const a = this.state.answers.map(x => this.num(x) || 0);\n    return { age: a[0], home: a[1], owing: a[2], repay: a[3], income: a[4], assets: 0, debts: 0 };\n  }\n  asm() {\n    const A = this.state.A, p = (x, d) => { const v = parseFloat(String(x).replace(/[,$%\\s]/g, '')); return isFinite(v) && v > 0 ? v : d; };\n    return { price: p(A.price, 650000), yield: p(A.yield, 4.5) / 100, rate: p(A.rate, 6) / 100, growth: p(A.growth, 6.8) / 100, lvr: p(A.lvr, 105) / 100, rentExpense: p(A.rentExpense, 25) / 100, dti: p(A.dti, 6), sell: p(A.sell, 3) / 100, tax: p(A.tax, 34.5) / 100, deprecBldg: p(A.deprecBldg, 2.5) / 100, buildPortion: p(A.buildPortion, 65) / 100, fittingsPool: p(A.fittingsPool, 44000), fittingsRate: p(A.fittingsRate, 25) / 100, loanCosts: p(A.loanCosts, 5500), loanCostYears: p(A.loanCostYears, 5) };\n  }\n\n  amortize(bal0, repay, rate) {\n    let bal = bal0, tot = 0; const byYear = [bal0], intByYear = [0]; let m = 0, never = false;\n    for (m = 1; m <= 480; m++) {\n      const i = bal * rate / 12; tot += i; bal = bal + i - repay;\n      if (m % 12 === 0) { byYear.push(Math.max(0, bal)); intByYear.push(tot); }\n      if (bal <= 0) break;\n    }\n    if (bal > 0) { never = true; m = 480; }\n    for (let y = byYear.length; y <= 41; y++) { byYear.push(Math.max(0, bal <= 0 ? 0 : bal)); intByYear.push(tot); }\n    return { months: m, totalInt: tot, byYear, intByYear, never };\n  }\n\n  compute() {\n    const inp = this.inputs(), A = this.asm();\n    const curYear = new Date().getFullYear();\n    const depositPer = Math.max(0, A.price * (1 - A.lvr + 0.05));\n    const newLoan = A.price * A.lvr;\n    const rent = A.price * A.yield;\n    const equity = Math.max(0, inp.home * 0.8 - inp.owing);\n    const cbe = depositPer <= 0 ? 3 : Math.floor(equity / depositPer);\n    let cbi = 0;\n    for (let n = 1; n <= 3; n++) { if (inp.owing + inp.debts + n * newLoan <= A.dti * (inp.income + 0.8 * n * rent)) cbi = n; }\n    const count = Math.min(cbe, cbi, 3);\n    const am = this.amortize(inp.owing, inp.repay, A.rate);\n    const yearsA = Math.min(40, Math.ceil(am.months / 12));\n    const ageA = inp.age + yearsA, yearA = curYear + yearsA;\n    const balAt = t => am.byYear[Math.min(t, 40)] ?? 0;\n    const intAt = t => am.intByYear[Math.min(t, 40)] ?? am.totalInt;\n    const base = { branch: 'full', equity, equityF: this.fmt(equity), incomeF: this.fmt(inp.income), depositNeededF: this.fmt(depositPer), shortfallF: this.fmt(Math.max(0, depositPer - equity)), priceF: this.fmt(A.price), neverA: am.never };\n    if (cbe === 0) return { ...base, branch: 'equity' };\n    if (count === 0) return { ...base, branch: 'income' };\n    const gr = t => Math.pow(1 + A.growth, t);\n    let yearsB = 0;\n    for (let t = 1; t <= 40; t++) {\n      const v = A.price * gr(t);\n      const cgt = Math.max(0, v - A.price) * 0.5 * A.tax;\n      const net = v * (1 - A.sell) - newLoan - cgt;\n      if (net >= balAt(t) + depositPer) { yearsB = t; break; }\n    }\n    if (!yearsB || yearsB >= yearsA) return { ...base, branch: 'clears' };\n    const h = yearsB;\n    const intCost = newLoan * A.rate;\n    const expenses = rent * A.rentExpense;\n    const buildingDeprec = A.price * A.buildPortion * A.deprecBldg;\n    const fittingsDeprec = A.fittingsPool * A.fittingsRate;\n    const loanCostDeprec = A.loanCosts / A.loanCostYears;\n    const totalDeductions = intCost + expenses + buildingDeprec + fittingsDeprec + loanCostDeprec;\n    const taxableLoss = totalDeductions - rent;\n    const taxBen = Math.max(0, taxableLoss) * A.tax;\n    const preTaxCF = rent - intCost - expenses;\n    const weekly = -(preTaxCF + taxBen) / 52;\n    const homeH = inp.home * gr(h), propH = A.price * gr(h);\n    const cgtH = Math.max(0, propH - A.price) * 0.5 * A.tax;\n    const saleNet = propH * (1 - A.sell) - newLoan - cgtH;\n    const leftover = saleNet - balAt(h) - depositPer;\n    const nwA = homeH - balAt(h) + inp.assets - inp.debts;\n    const nwB = homeH + leftover + inp.assets - inp.debts;\n    const nwC = nwB + (propH - newLoan - depositPer);\n    const wk = w => (w >= 0 ? this.fmt(w) : '+' + this.fmt(-w) + ' (positive)');\n    return {\n      ...base, count, col3: count >= 2, gap: yearsA - yearsB,\n      ageA, ageB: inp.age + yearsB, ageC: inp.age + yearsB,\n      yearA, yearB: curYear + yearsB, yearC: curYear + yearsB, horizonYear: curYear + h,\n      weeklyBF: wk(weekly), weeklyCF: wk(weekly * 2),\n      equityBF: this.fmt(depositPer), equityCF: this.fmt(depositPer * 2),\n      intAF: this.fmt(am.totalInt), intBF: this.fmt(intAt(h) + newLoan * A.rate * h), intCF: this.fmt(intAt(h) + 2 * newLoan * A.rate * h),\n      nwAF: this.fmt(nwA), nwBF: this.fmt(nwB), nwCF: this.fmt(nwC),\n      depositF: this.fmt(depositPer), loanF: this.fmt(newLoan), rentWkF: this.fmt(rent / 52),\n      repayF: this.fmt(inp.repay),\n      propPhrase: count >= 2 ? 'both properties' : 'the property'\n    };\n  }\n\n  componentDidUpdate(pp, ps) {\n    if (this.state.done && (ps.A !== this.state.A || ps.view !== this.state.view)) this.persist();\n  }\n\n  renderVals() {\n    const s = this.state;\n    const view = s.view;\n    const r = view === 'result' ? this.compute() : {};\n    const showForm = view === 'form';\n    const onGate = showForm && s.step === 5;\n    const q = this.Q[Math.min(s.step, 4)];\n    const A = s.A;\n    return {\n      scrollToCalc: () => { const el = document.getElementById('pwp-calc'); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.pageYOffset - 8 }); },\n      showForm, onGate, onQuestion: showForm && s.step < 5,\n      showLoading: view === 'loading',\n      showResult: view === 'result' && r.branch === 'full',\n      showEquityScreen: view === 'result' && r.branch === 'equity',\n      showIncomeScreen: view === 'result' && r.branch === 'income',\n      showClearsScreen: view === 'result' && r.branch === 'clears',\n      segs: [0, 1, 2, 3, 4].map(i => ({ c: i <= s.step ? '#B08A2E' : '#E5E2DC' })),\n      qNum: Math.min(s.step, 4) + 1, qTitle: q.t, qHelp: q.h, qMoney: q.m,\n      curVal: s.answers[Math.min(s.step, 4)] ?? '',\n      onQChange: e => { const a = s.answers.slice(); a[s.step] = e.target.value; this.setState({ answers: a, err: '', soft: false }); },\n      onQKey: e => { if (e.key === 'Enter') this.next(); },\n      onNext: this.next, onBack: this.back,\n      canBack: s.step > 0 && s.step < 7, noBack: s.step === 0,\n      hasErr: !!s.err, errMsg: s.err,\n      gName: s.gate.name, gEmail: s.gate.email, gMobile: s.gate.mobile,\n      onGateChange: e => this.setState({ gate: { ...s.gate, [e.target.dataset.key]: e.target.value }, err: '' }),\n      onGateKey: e => { if (e.key === 'Enter') this.gateSubmit(); },\n      onGateSubmit: this.gateSubmit,\n      r,\n      asmOpen: s.asmOpen, asmLabel: s.asmOpen ? '\\u2212' : '+',\n      onAsmToggle: () => this.setState({ asmOpen: !s.asmOpen }),\n      asmFields: [\n        { key: 'price', label: 'PROPERTY PRICE $', val: A.price, default: 650000 },\n        { key: 'yield', label: 'RENTAL YIELD % A YEAR', val: A.yield },\n        { key: 'rate', label: 'LOAN INTEREST %', val: A.rate },\n        { key: 'growth', label: 'GROWTH % A YEAR', val: A.growth },\n        { key: 'lvr', label: 'LENDING LIMIT (LVR) %', val: A.lvr },\n        { key: 'rentExpense', label: 'RENTAL EXPENSES % OF RENT', val: A.rentExpense },\n        { key: 'dti', label: 'DEBT-TO-INCOME CAP (X)', val: A.dti },\n        { key: 'sell', label: 'SELLING COSTS %', val: A.sell },\n        { key: 'tax', label: 'MARGINAL TAX RATE % (INCL. MEDICARE)', val: A.tax },\n        { key: 'deprecBldg', label: 'BUILDING DEPRECIATION % A YEAR', val: A.deprecBldg },\n        { key: 'buildPortion', label: 'BUILD PORTION OF PRICE %', val: A.buildPortion },\n        { key: 'fittingsPool', label: 'FITTINGS DEPRECIATION POOL $', val: A.fittingsPool },\n        { key: 'fittingsRate', label: 'FITTINGS DEPRECIATION RATE % (YR 1)', val: A.fittingsRate },\n        { key: 'loanCosts', label: 'LOAN ESTABLISHMENT COSTS $', val: A.loanCosts },\n        { key: 'loanCostYears', label: 'LOAN COSTS AMORTISED OVER (YEARS)', val: A.loanCostYears }\n      ],\n      onAsmChange: e => this.setState({ A: { ...s.A, [e.target.dataset.key]: e.target.value } }),\n      av: { yield: A.yield, growth: A.growth, rate: A.rate, lvr: A.lvr, dti: A.dti, sell: A.sell }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
